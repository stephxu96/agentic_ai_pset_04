<style>
/* Layout: one technical drawing filling the frame, with a CAD-style title block above it. */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{

body{background:var(--bg);color:var(--ink);font-family:var(--f-body)}
.wrap{max-width:1640px;margin:0 auto;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.tb{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;border:1.5px solid var(--ink);background:var(--sheet)}
.tb>div{padding:10px 16px;border-left:1px solid var(--rule);min-width:0}
.tb>div:first-child{border-left:0}
.tb .k{font:600 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tb .v{font:400 14px/1.3 var(--f-mono);margin-top:6px;font-variant-numeric:tabular-nums}
.tb h1{font:600 26px/1.1 var(--f-display);margin:4px 0 0;text-wrap:balance;letter-spacing:.01em}
@media (max-width:760px){.tb{grid-template-columns:1fr 1fr}.tb>div:first-child{grid-column:1/-1}.tb>div:nth-child(2){border-left:0}.tb>div{border-top:1px solid var(--rule)}}
.sheet{background:var(--sheet);border:1.5px solid var(--ink);overflow-x:auto}
svg{display:block;width:100%;min-width:1100px;height:auto}
svg text{fill:var(--ink)}
.lane{fill:var(--lane);stroke:none}
.lane-h{fill:var(--human-bg);stroke:var(--human);stroke-width:1;stroke-dasharray:5 4}
.store-p{fill:var(--store-bg);stroke:var(--store);stroke-width:1.2}
.leg{fill:none;stroke:var(--rule)}
.callout{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3}
.b rect{fill:var(--sheet);stroke:var(--ink);stroke-width:1.1}
.b.entry rect{stroke-width:2.4}
.b.input rect{fill:var(--lane);stroke-dasharray:4 3}
.b.human rect,.b-h{fill:var(--sheet);stroke:var(--human);stroke-width:2}
.b.store rect,.b-s{fill:var(--sheet);stroke:var(--store);stroke-width:1.6}
.b rect.tag,.tag{fill:var(--accent);stroke:none}
.tagt{fill:var(--accent-ink)!important;font:600 11px var(--f-mono);letter-spacing:.08em}
.t{font-size:14px;font-weight:600}
.t.mono{font-family:var(--f-mono)}
.t.sans{font-family:var(--f-body);font-size:15.5px}
.b.human .t{fill:var(--human)}
.b.store .t{fill:var(--store)}
.d{font:400 13px var(--f-body);fill:var(--muted)!important}
.o{font:400 12.5px var(--f-mono)}
.lt{font:600 17px var(--f-mono)}
.lt-s{font:600 15px var(--f-mono)}
.ls{font:400 13px var(--f-body);fill:var(--muted)!important;letter-spacing:.02em}
.ln-num{font:600 18px var(--f-display);fill:var(--accent)!important}
.mode{font:600 13px var(--f-mono)}
.lbl{font:400 11.5px var(--f-body);fill:var(--muted)!important}
.lbl-m{font:400 12.5px var(--f-mono);fill:var(--muted)!important}
.note{font:400 13px var(--f-body);fill:var(--muted)!important}
.note-b{font:600 13px var(--f-body)}
.ln{fill:none;stroke:var(--ink);stroke-width:1.3}
.ah{fill:var(--ink)}
</style>
